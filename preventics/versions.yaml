# this file is used to extract the versions of the application that are to be released
# the addition of new versions is done only by dev team
# this versions definition file also defines the target environments for the application
# as well as the environment precedence

application:
  name: Preventics
  type: k8s
  envs: [staging, qa, preprod, prod]

  versions:
    3.28.34:
      backend:
        image: aixpand/backend:release-3.44.6
      frontend:
        image: aixpand/investigator:banksight-1.0.4
      summary: |
        open the crop rectangle picker immediately when a camera is cloned as a
        cropped camera, instead of leaving the operator on an empty coordinate
        form
        default a location's timezone when none is supplied so partition
        scheduling resolves consistently
        backend release-3.44.6, frontend 1.0.4

    3.28.33:
      backend:
        image: aixpand/backend:release-3.44.5
      frontend:
        image: aixpand/investigator:banksight-1.0.2
      summary: |
        complete cropped-clone camera capture across FE, BE, and E2 with strict
        crop-region handling, live-view session recovery, and bounded cleanup
        add ticket-ready operator diagnostics that retain actionable backend
        and E2 failure reasons while redacting credentials
        harden camera, plugin-group, and pipeline lifecycle mutations with
        shared edge locking, strict acknowledgements, transactional metadata
        and status writes, correlated archive handling, and bounded retries
        cumulative over backend 3.44.2-3.44.5 and frontend 1.0.1-1.0.2
        requires E2 5.1.460 on the target node before cropped-clone cameras are
        created
        live Oracle validation remains required before promotion to an
        Oracle-backed environment
        backend release-3.44.5, frontend 1.0.2

    3.28.32:
      backend:
        image: aixpand/backend:release-3.44.1
      frontend:
        image: aixpand/investigator:banksight-1.0.0
      summary: |
        first 1.x front-end release
        add a "Click for node commands" hint on the node dashboard, whose node
        name cell was actionable with no visible affordance
        resolve 16 operator-facing labels that rendered as raw keys such as
        en:collapse_navigation_menu; translations are served by the backend
        from its own definitions, so these required backend release-3.44.1 and
        could not be fixed in the front-end
        supersedes 3.28.31, whose side-nav collapse control shipped without a
        resolvable tooltip label
        backend release-3.44.1, frontend 1.0.0

    3.28.31:
      backend:
        image: aixpand/backend:release-3.44.0
      frontend:
        image: aixpand/investigator:banksight-0.93.0
      summary: |
        make the left navigation collapsible to an 86px icon rail, with the
        active section's subitems shown as nested icons and the expanded or
        collapsed choice remembered across sessions
        add the cropped-clone meta-stream capture front-end (frontend 0.92.0,
        not previously released)
        backend release-3.44.0 supplies the clone_as_cropped_camera label that
        release-3.43.0 lacked; translations are served by the backend, so the
        front-end alone cannot resolve that string
        backend release-3.44.0, frontend 0.93.0

    3.28.30:
      backend:
        image: aixpand/backend:release-3.43.0
      frontend:
        image: aixpand/investigator:banksight-0.91.0
      summary: |
        add camera area-of-interest cropping with a snapshot rectangle picker,
        strict FE/BE crop validation, backend-specific E2 stream configuration,
        and confirmed camera relaunch when crop geometry changes
        add localized EN/RO tooltips and accessible labels for operator-facing
        icon controls across the application
        live Oracle migration validation remains required before promotion to
        any Oracle-backed environment
        backend release-3.43.0, frontend 0.91.0; E2 unchanged

    3.28.29:
      backend:
        image: aixpand/backend:release-3.41.3
      frontend:
        image: aixpand/investigator:banksight-0.90.3
      summary: |
        accept SDK no-command results for runtime-neutral plugin-group topology
        changes while keeping published E2 acknowledgements fail-closed
        add ticket-ready operator diagnostics with copy-all logs, UTC and
        application/runtime context, structured plugin-group operation details,
        secret and URL-query redaction, and correct empty HTTP error handling
        live Oracle migration validation remains required before promotion to
        any Oracle-backed environment
        backend release-3.41.3, frontend 0.90.3

    3.28.28:
      backend:
        image: aixpand/backend:release-3.41.2
      frontend:
        image: aixpand/investigator:banksight-0.90.2
      summary: |
        add ONLINE/LOST STATUS dashboard filtering, restrict dashboard suppression
        to exact LOST STATUS nodes, and copy individual log cards
        make plugin metadata cleanup durable, tenant-safe, and exact-session correlated
        expose PEOPLE_PRESENCE_01
        add the HSV color-range picker and backend schemas for opt-in uniform-color
        staff exclusion across PEOPLE_COUNTING_02 and people-presence plugins;
        runtime activation requires a separate E2 semantic release containing
        the color-exclusion runtime
        show FE/BE versions on login and improve browser credential autofill
        reconcile camera state after E2 pipeline failures and redact URL credentials
        live Oracle migration validation is required before promotion to any
        Oracle-backed environment
        backend release-3.41.2, frontend 0.90.2

    3.28.27:
      backend:
        image: aixpand/backend:release-3.40.1
      frontend:
        image: aixpand/investigator:banksight-0.89.22
      summary: |
        default node-command encryption wire format to 'flagged' in backend
        config (no env var needed; explicit 'legacy' override remains for
        old-SDK fleets) — completes the jsclient 4.2.0 dual-format fix
        backend release-3.40.1, frontend unchanged

    3.28.26:
      backend:
        image: aixpand/backend:release-3.40.0
      frontend:
        image: aixpand/investigator:banksight-0.89.22
      summary: |
        add configurable node-command encryption wire format (jsclient 4.2.0
        dual-format: tolerant decrypt + 'flagged' python-parity encrypt);
        inert while Preventics runs AIXPAND_BC_ENCRYPT=0 but keeps the
        backend fleet consistent and ready for encrypted commands
        fix: use normalized NET_MON time for node suppression
        backend release-3.40.0, frontend 0.89.22 (unchanged)

    3.28.25:
      backend:
        image: aixpand/backend:release-3.39.24
      frontend:
        image: aixpand/investigator:banksight-0.89.22
      summary: |
